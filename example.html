<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brand kit example</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      body {
        margin: 0;
        padding: var(--space-5);
        background: var(--color-surface);

        font-family: var(--font-mono);

  </head>
  <body>
    <h1>Small Tools Co</h1>
    <p>Colours, type and spacing shared by every client site.</p>
